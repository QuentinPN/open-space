# The macOS app (npm run app): release/Open Space-<version>-<arch>.dmg, plus the .zip and latest-mac.yml that
# electron-updater reads from the GitHub release. The Windows app (npm run app:win): the NSIS installer, its .blockmap
# and latest.yml. Everything the app runs is bundled in out/ (vite.desktop.config.ts), so no node_modules ships, but
# node-pty (the integrated terminal, server/terminal.ts): native, so left out of the bundle and shipped whole, for the
# platform being built, and unpacked from the asar (a .node, the helpers and the worker scripts run from real files).
appId: io.github.fantomiald.open-space
productName: Open Space
copyright: Fantomiald
directories:
  output: release
  buildResources: desktop/build
files:
  - out/**/*
  - package.json
  - "!node_modules/**/*"
  - node_modules/node-pty/package.json
  - node_modules/node-pty/lib/**/*
  - "!node_modules/node-pty/lib/**/*.{map,test.js}"
  - "node_modules/node-pty/prebuilds/*-${arch}/**/*"
  - "!node_modules/node-pty/prebuilds/**/*.pdb"
# N-API prebuilds (the same binary for every Electron): nothing to compile, and nothing from the machine that builds
npmRebuild: false
asarUnpack:
  - node_modules/node-pty/**/*
# The keys vault (server/vault.ts) trusts that only this app's own code asks the main process to decrypt: no running it
# as plain node, no NODE_OPTIONS or inspector to inject code, and only the signed app.asar is loaded. That matters on
# macOS, where the Keychain gives the key to this signed app alone; on Windows (DPAPI) and Linux (the session keyring)
# any program of the user's account can decrypt the file anyway, so there the vault only keeps keys off the disk in clear.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  files:
    - "!node_modules/node-pty/prebuilds/win32-*/**/*"
  hardenedRuntime: true
  entitlements: desktop/build/entitlements.mac.plist
  entitlementsInherit: desktop/build/entitlements.mac.plist
  extendInfo:
    # asked once, the first time Open Space drives Music or Spotify (the radio) or opens a terminal
    NSAppleEventsUsageDescription: Open Space pilote Musique ou Spotify pour la radio du bureau, et ouvre ton terminal.
dmg:
  artifactName: Open Space-${version}-${arch}.${ext}
win:
  files:
    - "!node_modules/node-pty/prebuilds/darwin-*/**/*"
  icon: desktop/build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: Open Space-Setup-${version}-${arch}.${ext}
# one click, per user (no UAC): electron-updater runs it again silently for each update
nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
publish:
  provider: github
  owner: Fantomiald
  repo: open-space
